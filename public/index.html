<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agriculture Marketing System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

  <nav class="bg-green-700 text-white px-6 py-4 flex justify-between items-center">
    <h1 class="text-xl font-bold">🌾 Agriculture Marketing System</h1>
    <button id="refresh" class="bg-green-600 hover:bg-green-500 px-3 py-1 rounded text-sm">Refresh</button>
  </nav>

  <main class="max-w-6xl mx-auto p-4">
    <!-- Stat cards -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 my-4">
      <div class="bg-white rounded-lg shadow p-4"><p class="text-sm text-gray-500">Active Crops</p><p id="stat-crops" class="text-3xl font-bold text-green-700">–</p></div>
      <div class="bg-white rounded-lg shadow p-4"><p class="text-sm text-gray-500">Market Price Alerts (hold advised)</p><p id="stat-alerts" class="text-3xl font-bold text-amber-600">–</p></div>
      <div class="bg-white rounded-lg shadow p-4"><p class="text-sm text-gray-500">Pending Shipments</p><p id="stat-ship" class="text-3xl font-bold text-blue-600">–</p></div>
    </div>

    <!-- Tabs -->
    <div class="flex border-b mb-4">
      <button data-tab="market" class="tab px-4 py-2 border-b-2 font-medium">Crop Marketplace</button>
      <button data-tab="decision" class="tab px-4 py-2 border-b-2 font-medium">Farmer Decision Panel</button>
      <button data-tab="shipments" class="tab px-4 py-2 border-b-2 font-medium">Shipments</button>
    </div>

    <!-- Marketplace -->
    <section id="tab-market"><div id="crop-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div></section>

    <!-- Decision panel -->
    <section id="tab-decision" class="hidden bg-white rounded-lg shadow p-6 max-w-xl">
      <h2 class="text-lg font-semibold mb-3">Should I sell or hold?</h2>
      <div class="flex gap-2">
        <select id="crop-select" class="flex-1 border rounded px-3 py-2"></select>
        <button id="analyze" class="bg-green-700 hover:bg-green-600 text-white px-4 py-2 rounded">Analyze</button>
      </div>
      <div id="decision-result" class="mt-5"></div>
    </section>

    <!-- Shipments -->
    <section id="tab-shipments" class="hidden bg-white rounded-lg shadow overflow-x-auto">
      <table class="w-full text-sm text-left">
        <thead class="bg-gray-100 text-gray-600"><tr>
          <th class="p-3">Order</th><th class="p-3">Customer</th><th class="p-3">Address</th><th class="p-3">Status</th>
          <th class="p-3">ETA</th><th class="p-3">Provider</th><th class="p-3">Provider phone</th></tr></thead>
        <tbody id="ship-body"></tbody>
      </table>
    </section>
  </main>

  <!-- Order modal -->
  <div id="modal" class="hidden fixed inset-0 bg-black/50 items-center justify-center p-4 z-40">
    <form id="order-form" class="bg-white rounded-lg shadow-lg p-6 w-full max-w-lg max-h-full overflow-y-auto space-y-3">
      <h2 class="text-lg font-semibold">Place Order</h2>
      <p id="order-info" class="text-sm text-gray-600"></p>
      <div class="grid grid-cols-2 gap-3">
        <input name="first_name" placeholder="First name" required class="border rounded px-3 py-2">
        <input name="last_name" placeholder="Last name" required class="border rounded px-3 py-2">
        <input name="phone" placeholder="Phone" required class="border rounded px-3 py-2 col-span-2">
        <input name="street" placeholder="Street" class="border rounded px-3 py-2 col-span-2">
        <input name="district" placeholder="District" class="border rounded px-3 py-2">
        <input name="state" placeholder="State" class="border rounded px-3 py-2">
        <input name="pincode" placeholder="Pincode" maxlength="6" class="border rounded px-3 py-2">
        <input name="quantity" type="number" min="0.01" step="0.01" placeholder="Quantity (kg)" required class="border rounded px-3 py-2">
        <select name="payment_mode" class="border rounded px-3 py-2"><option>UPI</option><option>CARD</option><option>CASH</option></select>
        <select name="lp_id" id="lp-select" required class="border rounded px-3 py-2"></select>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button type="button" id="cancel" class="px-4 py-2 rounded border">Cancel</button>
        <button type="submit" class="px-4 py-2 rounded bg-green-700 hover:bg-green-600 text-white">Confirm Order</button>
      </div>
    </form>
  </div>

  <div id="toasts" class="fixed top-4 right-4 space-y-2 z-50"></div>
  <script src="js/app.js"></script>
</body>
</html>
